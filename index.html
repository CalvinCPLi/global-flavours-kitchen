/* ---------- scaling ---------- */
var NUM='(\\d+\\/\\d+|\\d+(?:\\.\\d+)?)';
function pn(t){if(t.indexOf('/')>0){var p=t.split('/');return +p[0]/+p[1]}return +t}
function fmt(n){
  if(n>=10)return String(Math.round(n));
  var q=Math.round(n*4)/4,w=Math.floor(q),f=q-w;
  var fr={0.25:'¼',0.5:'½',0.75:'¾'}[f]||'';
  return (w?String(w):'')+fr||'0';
}
function scaleLine(s,f){
  if(Math.abs(f-1)<1e-9)return s;
  var re=new RegExp('^(\\s*)'+NUM+'(?:\\s*[–-]\\s*'+NUM+')?(?=\\s)');
  var out=s.replace(re,function(m,sp,a,b){return sp+fmt(pn(a)*f)+(b?'–'+fmt(pn(b)*f):'')});
  out=out.replace(new RegExp('(\\+\\s*)'+NUM+'(?=\\s)','g'),function(m,pl,a){return pl+fmt(pn(a)*f)});
  out=out.replace(new RegExp('\\((about\\s+)?'+NUM+'\\s*(g|ml)\\)','g'),function(m,ab,a,u){return '('+(ab||'')+fmt(pn(a)*f)+' '+u+')'});
  if(f>1)out=out.replace(/^(\s*[\d¼½¾–.]+) can\b/,'$1 cans');
  return out;
}

/* ---------- stainless pan notes ---------- */
function panAuto(r){
  var t=(r.ingredients.join(' ')+' '+r.steps.join(' ')).toLowerCase();
  if(!/\bpan\b|skillet|wok|sear|fry|brown|simmer|stir-fry/.test(t))return [];
  var o=['Preheat the empty pan on medium for 2–3 minutes and do the water test (drops bead and glide). Then add oil, then food.'];
  if(/skin-side/.test(t))o.push('Salmon skin: press it flat for 15 seconds, then leave it. The skin releases by itself once crisp. If it grabs, give it 30–60 seconds more.');
  else if(/mince/.test(t))o.push('Spread the mince in one layer and leave it 2 minutes before breaking it up, so it browns and lets go of the pan.');
  else if(/sear|brown|steak|chicken|pork|beef|lamb|salmon|prawn|tofu/.test(t))o.push('Pat food dry and do not crowd the pan; cook in batches. It lets go by itself once browned. If it grabs, wait another 30–60 seconds before turning.');
  if(/honey|mirin|sugar|teriyaki|hoisin|miso|gochujang|marinade/.test(t))o.push('Sugars and pastes scorch fast on stainless. Drop to medium-low before the sauce goes in.');
  if(/\bwok\b|stir-fry/.test(t))o.push('A stainless pan is not a wok: use your widest pan, medium-high heat, small batches, and keep things moving.');
  if(/orzo|risotto|noodles|\brice\b/.test(t)&&/simmer|stir often|stir-fry|scramble/.test(t))o.push('Starchy foods grab stainless: use a little extra oil and keep stirring.');
  if(/stock|wine|scraping/.test(t))o.push('Browned bits are flavour. Add the liquid and scrape them up.');
  return o.slice(0,4);
}
function panLines(r){
  var s=(r.pan!==undefined&&r.pan!==null)?String(r.pan):panAuto(r).join('\n');
  return s.split('\n').map(function(x){return x.trim()}).filter(Boolean);
}

/* ---------- timers ---------- */
function timersIn(text){
  var re=/(\d+)(?:\s*[–-]\s*(\d+))?\s*(seconds?|secs?|minutes?|mins?)\b/gi,m,out=[],seen={};
  while((m=re.exec(text))){
    var a=+m[1],unit=/^s/i.test(m[3])?'s':'m',sec=unit==='s'?a:a*60;
    var label=(m[2]?m[1]+'–'+m[2]:m[1])+(unit==='s'?' sec':' min');
    if(!seen[label]&&sec>=10&&sec<=3600){seen[label]=1;out.push({sec:sec,label:label})}
  }
  return out;
}
var T=[],tid=0,ac=null;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){
  try{
    unlockAudio();if(!ac)return;
    [0,.25,.5].forEach(function(d){
      var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;
      o.frequency.value=880;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22);
    });
  }catch(e){}
}
function mmss(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function addTimer(sec,label){
  unlockAudio();
  T.push({id:++tid,label:label,sec:sec,end:Date.now()+sec*1000,done:false,beeps:0,last:0});
  drawTray();
}
function drawTray(){
  var el=$('#tray');
  el.hidden=!T.length;
  document.body.classList.toggle('has-timers',!!T.length);
  el.innerHTML=T.map(function(t){
    return '<div class="tm'+(t.done?' done':'')+'" data-tid="'+t.id+'"><span class="tl">'+esc(t.label)+'</span><span class="tt">'+mmss(Math.max(0,Math.ceil((t.end-Date.now())/1000)))+'</span>'+
      '<button type="button" data-act="tadd" data-id="'+t.id+'" aria-label="Add one minute">+1</button>'+
      '<button type="button" data-act="tdel" data-id="'+t.id+'" aria-label="Dismiss timer">✕</button></div>';
  }).join('');
}
setInterval(function(){
  if(!T.length)return;
  var now=Date.now(),redraw=false;
  T.forEach(function(t){
    var left=Math.max(0,Math.ceil((t.end-now)/1000));
    var el=document.querySelector('[data-tid="'+t.id+'"] .tt');
    if(el)el.textContent=mmss(left);
    if(left===0&&!t.done){t.done=true;redraw=true}
    if(t.done&&t.beeps<12&&now-t.last>3500){t.last=now;t.beeps++;beep();try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
  });
  if(redraw)drawTray();
},250);

var SYK='gfk.sync',SY={url:'',room:'',me:'',sig:{},ts:{},pby:{},other:{},last:0,err:''},syncBusy=false,syncT=0;
function loadSync(){try{var s=localStorage.getItem(SYK);if(s)Object.assign(SY,JSON.parse(s))}catch(e){}}
function saveSync(){try{localStorage.setItem(SYK,JSON.stringify(SY))}catch(e){}}
function syncOn(){return !!(SY.url&&SY.room&&SY.me)}
function syncSoon(){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(syncNow,1500)}
function localItems(){
  var L={};Object.keys(store.plan).forEach(function(d){L['plan/'+d]={id:store.plan[d]}});
  store.added.forEach(function(r){L['recipes/'+r.id]=r});
  Object.keys(store.edits).forEach(function(id){L['recipes/'+id]=store.edits[id]});
  return L;
}
function applyRemote(kind,id,v){
  if(kind==='plan'){if(v&&v.id)store.plan[id]=v.id;else delete store.plan[id];return}
  if(!v)return;
  if(isBuiltin(id)){store.edits[id]=v;return}
  var i=store.added.findIndex(function(x){return x.id===id});
  if(i>=0)store.added[i]=v;else store.added.push(v);
}
function paintSync(){
  var b=$('#sync-btn');if(!b)return;
  b.textContent=syncOn()?(SY.err?'Sync !':'Sync ♥'):'Sync';
}
function syncNow(){
  if(!syncOn()||syncBusy)return;syncBusy=true;
  var base=SY.url.replace(/\/+$/,'')+'/rooms/'+encodeURIComponent(SY.room);
  fetch(base+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status+(r.status===401||r.status===403?' (check database rules)':''));return r.json()}).then(function(remote){
    remote=remote||{};var rp=remote.plan||{},rr=remote.recipes||{},rf=remote.favs||{};
    var L=localItems(),now=Date.now(),patch={},changed=false,keys={};
    Object.keys(L).concat(Object.keys(SY.sig)).forEach(function(k){if(k!=='favs')keys[k]=1});
    Object.keys(rp).forEach(function(d){keys['plan/'+d]=1});Object.keys(rr).forEach(function(i){keys['recipes/'+i]=1});
    Object.keys(keys).forEach(function(k){
      var kind=k.split('/')[0],id=k.slice(kind.length+1),lv=L[k],lstr=lv===undefined?undefined:JSON.stringify(lv),ls=SY.sig[k];
      var rv=(kind==='plan'?rp:rr)[id],chg=lstr!==ls;
      if(chg&&ls===undefined&&rv&&rv.ts>(SY.ts[k]||0))chg=false;
      if(chg){
        if(lv===undefined&&kind==='recipes'){delete SY.sig[k];return}
        patch[kind+'/'+id]={v:lv===undefined?null:lv,ts:now,by:SY.me};
        if(lstr===undefined)delete SY.sig[k];else SY.sig[k]=lstr;
        SY.ts[k]=now;if(kind==='plan')SY.pby[id]=SY.me;
      }else if(rv&&rv.ts>(SY.ts[k]||0)){
        applyRemote(kind,id,rv.v);SY.ts[k]=rv.ts;if(kind==='plan')SY.pby[id]=rv.by;
        var nl=localItems()[k];if(nl===undefined)delete SY.sig[k];else SY.sig[k]=JSON.stringify(nl);changed=true;
      }
    });
    var mine=rf[SY.me]?Object.keys(rf[SY.me]).map(function(i){return rf[SY.me][i]}):[];
    if(SY.sig.favs===undefined){mine.forEach(function(x){if(store.favs.indexOf(x)<0&&byId(x)){store.favs.push(x);changed=true}})}
    var fs=JSON.stringify(store.favs);
    if(fs!==SY.sig.favs||JSON.stringify(mine)!==fs){patch['favs/'+SY.me]=store.favs.length?store.favs:null;SY.sig.favs=fs}
    SY.other={};Object.keys(rf).forEach(function(n){if(n!==SY.me)SY.other[n]=Object.keys(rf[n]||{}).map(function(i){return rf[n][i]})});
    var go=Object.keys(patch).length?fetch(base+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status)}):Promise.resolve();
    return go.then(function(){
      SY.err='';SY.last=Date.now();
      if(changed){noSync=true;saveStore();noSync=false}
      saveSync();
      var typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if(!S.cook&&S.view!=='edit'&&$('#modal').hidden&&!typing)render();
    });
  }).catch(function(e){SY.err=String(e&&e.message||e);saveSync()}).then(function(){syncBusy=false;paintSync()});
}

  var c=S.cook,r=c&&byId(c.id);if(!r){exitCook();return}
  var steps=cookSteps(r),st=steps[c.i],first=steps.findIndex(function(x){return x.t==='step'}),M=r.steps.length;
  var prog='<div class="prog">'+steps.map(function(_,i){return '<i class="'+(i<=c.i?'on':'')+'"></i>'}).join('')+'</div>';
  var body='';
  if(st.t==='mise'){
    body='<div class="kick">Before you start</div><h2 style="font-size:clamp(1.8rem,4vw,2.8rem)">Gather and prep</h2>'+(S.n!==r.servings?'<p class="hint">Cooking for '+S.n+'. Amounts in the method are for '+r.servings+'; use a wider pan or batches.</p>':'')+ingList(r,true);
  }else if(st.t==='pan'){
    body='<div class="kick">Stainless pan check</div><p class="big">Heat the empty pan on medium for 2–3 minutes. Flick in a few drops of water. When they bead and glide, add oil, then food.</p>'+
      '<div class="tbtns"><button type="button" class="btn primary" data-act="timer" data-sec="150" data-label="Pan preheat">⏱ Preheat 2:30</button></div>'+
      '<div class="note pan">'+panLines(r).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>';
  }else if(st.t==='step'){
    var k=c.i-first,nx=steps[c.i+1];
    var tb=timersIn(st.text).map(function(t){return '<button type="button" class="btn primary" data-act="timer" data-sec="'+t.sec+'" data-label="Step '+(k+1)+' · '+esc(t.label)+'">⏱ '+esc(t.label)+'</button>'}).join('');
    body='<div class="kick">Step '+(k+1)+' of '+M+'</div><p class="big">'+esc(st.text)+'</p>'+(tb?'<div class="tbtns">'+tb+'</div>':'')+
      (nx&&nx.t==='step'?'<div class="next"><b>Next:</b> '+esc(nx.text)+'</div>':'');
  }else{
    body='<div class="kick love">Done · Bon appétit, Bubu ♥</div><h2 style="font-size:clamp(1.8rem,4vw,2.8rem)">'+esc(r.name)+'</h2>'+(r.tip?'<div class="note"><h4>Chef\'s note</h4><p>'+esc(r.tip)+'</p></div>':'')+
      '<div class="note pan"><h4>Pan care</h4><p>Let the stainless pan cool before rinsing. For stuck bits, simmer water with a drop of dish soap and loosen with a wooden spoon. Dry it right away.</p></div>'+
      '<div class="tbtns"><button type="button" class="btn" data-act="fav" data-id="'+esc(r.id)+'">'+(store.favs.indexOf(r.id)>=0?'★ Saved':'☆ Save this recipe')+'</button><button type="button" class="btn primary" data-act="cookexit">Finish</button></div>';
  }
  var last=c.i===steps.length-1;
  $('#cook').innerHTML=
    '<div class="chead"><button type="button" class="icon-btn" data-act="cookexit" aria-label="Exit cook mode">✕</button><div class="ti"><b>'+esc(r.name)+'</b><span>'+(c.i+1)+' / '+steps.length+'</span></div>'+
    '<button type="button" class="icon-btn" id="wakebtn" data-act="wake" aria-pressed="'+(!!wl)+'" aria-label="Keep screen on" title="Keep screen on">☀</button>'+
    '<button type="button" class="btn" data-act="drawer">Ingredients</button></div>'+prog+
    '<div class="cbody">'+body+'</div>'+
    '<div class="cnav"><button type="button" class="btn" data-act="cprev"'+(c.i===0?' disabled':'')+'>‹ Back</button><button type="button" class="btn primary" data-act="cnext"'+(last?' disabled':'')+'>'+(c.i===0?'Start':'Next')+' ›</button></div>'+
    (c.drawer?'<aside class="drawer"><div style="display:flex;justify-content:space-between;align-items:center;gap:1rem"><h2>Ingredients</h2><button type="button" class="icon-btn" data-act="drawer" aria-label="Close ingredients">✕</button></div>'+ingList(r,false)+'</aside>':'');
  $('#cook').hidden=false;
  var cb=$('#cook .cbody');if(cb)cb.scrollTop=0;
}

/* ---------- modals ---------- */
function openModal(html){var m=$('#modal');m.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false}
function closeModal(){var m=$('#modal');m.hidden=true;m.innerHTML=''}
function backupModal(){
  var json=JSON.stringify(store);
  openModal('<h2>Backup</h2><p class="hint">Your edits live on this device. Copy this text somewhere safe, and paste it back on another device to restore.</p>'+
    '<textarea id="bk" readonly>'+esc(json)+'</textarea>'+
    '<div class="actions"><button type="button" class="btn primary" data-act="bkcopy">Copy</button>'+(window.__PWA?'<button type="button" class="btn" data-act="bkdl">Download file</button>':'')+'</div>'+
    '<h2 style="font-size:1.25rem">Restore from backup</h2><textarea id="bki" placeholder="Paste backup text here"></textarea>'+
    '<div class="actions"><button type="button" class="btn" data-act="bkimp">Restore these edits</button>'+
    (store.deleted.length?'<button type="button" class="btn" data-act="undel">Bring back '+store.deleted.length+' deleted recipe'+(store.deleted.length>1?'s':'')+'</button>':'')+
    '<button type="button" class="btn" data-act="mclose">Close</button></div>');
}
function newModal(){
  openModal('<h2>New recipe</h2><p class="hint">Paste a recipe from anywhere to fill the form. Put the title on the first line, then a line saying Ingredients and a line saying Method. Or start blank.</p>'+
    '<textarea id="paste" placeholder="Lemon Garlic Chicken&#10;Ingredients&#10;300 g chicken breast&#10;2 garlic cloves&#10;Method&#10;Sear the chicken..."></textarea>'+
    '<div class="actions"><button type="button" class="btn primary" data-act="parse">Fill the form from this text</button><button type="button" class="btn" data-act="blank">Start blank</button><button type="button" class="btn" data-act="mclose">Cancel</button></div>');
}
function parsePaste(txt){
  var name='',ing=[],st=[],mode='';
  txt.split('\n').forEach(function(l){
    l=l.trim();if(!l)return;
    if(/^ingredients?:?$/i.test(l)){mode='i';return}
    if(/^(method|directions?|instructions?|steps?|preparation):?$/i.test(l)){mode='s';return}
    if(!mode){if(!name)name=l;return}
    (mode==='i'?ing:st).push(l);
  });
  return {name:name,ing:lines(ing.join('\n'),false),st:lines(st.join('\n'),true)};
}

/* ---------- actions ---------- */
var delTimer=null;
function act(a,d,el){
  switch(a){
    case 'nav':S.view=d.v;render();window.scrollTo(0,0);break;
    case 'filter':S.filter=d.f;render();break;
    case 'open':S.id=d.id;S.n=byId(d.id).servings;S.view='recipe';render();window.scrollTo(0,0);break;
    case 'fav':{var i=store.favs.indexOf(d.id);if(i>=0)store.favs.splice(i,1);else store.favs.push(d.id);saveStore();if(S.cook)renderCook();else render();break}
    case 'srv':{S.n=Math.min(12,Math.max(1,S.n+(+d.d)));render();break}
    case 'edit':{var r=byId(d.id);S.draft=JSON.parse(JSON.stringify(r));S.view='edit';render();window.scrollTo(0,0);break}
    case 'dupe':{var r2=JSON.parse(JSON.stringify(byId(d.id)));r2.id='u'+Date.now().toString(36);r2.name=r2.name+' (copy)';delete r2.isNew;r2.sources=r2.sources||[];store.added.push(r2);saveStore();S.id=r2.id;S.n=r2.servings;S.view='recipe';render();window.scrollTo(0,0);toast('Duplicated. Edit the copy freely.');break}
    case 'new':newModal();break;
    case 'blank':closeModal();S.draft=blankDraft();S.view='edit';render();window.scrollTo(0,0);break;
    case 'parse':{var p=parsePaste($('#paste').value);if(!p.ing.length&&!p.st.length){toast('Add a line saying Ingredients and a line saying Method.');break}
      closeModal();var b=blankDraft();b.name=p.name;b.ingredients=p.ing;b.steps=p.st;S.draft=b;S.view='edit';render();window.scrollTo(0,0);break}
    case 'cancel':{var cid=S.draft&&S.draft.id;S.draft=null;S.view=(cid&&byId(cid))?'recipe':'library';render();break}
    case 'save':{var d2=readDraft();if(!d2.name){toast('Give the recipe a name.');break}if(!d2.ingredients.length||!d2.steps.length){toast('Add at least one ingredient and one step.');break}
      if(d2.id){if(isBuiltin(d2.id))store.edits[d2.id]=d2;else store.added=store.added.map(function(x){return x.id===d2.id?d2:x})}
      else{d2.id='u'+Date.now().toString(36);store.added.push(d2)}
      saveStore();S.id=d2.id;S.n=d2.servings;S.draft=null;S.view='recipe';render();window.scrollTo(0,0);toast('Saved.');break}
    case 'del':{if(el.dataset.arm){var id=S.draft.id;if(isBuiltin(id)){delete store.edits[id];if(store.deleted.indexOf(id)<0)store.deleted.push(id)}else store.added=store.added.filter(function(x){return x.id!==id});
        store.favs=store.favs.filter(function(x){return x!==id});saveStore();S.draft=null;S.view='library';render();toast('Deleted. Backup has a button to bring built-in recipes back.')}
      else{el.dataset.arm='1';el.textContent='Tap again to delete';clearTimeout(delTimer);delTimer=setTimeout(function(){el.dataset.arm='';el.textContent='Delete'},3500)}break}
    case 'reset':{var id2=S.draft.id;delete store.edits[id2];saveStore();S.draft=JSON.parse(JSON.stringify(byId(id2)));render();toast('Original restored. Save or cancel to leave.');break}
    case 'backup':backupModal();break;
    case 'mclose':closeModal();break;
    case 'syncmodal':syncModal();break;
    case 'syncgen':$('#sy-room').value=syncModal.rnd();break;
    case 'syncsave':{var u=($('#sy-url').value||'').trim(),rm=($('#sy-room').value||'').trim().replace(/[^A-Za-z0-9_-]/g,''),nm=cleanName($('#sy-me').value);
      if(!/^(https:\/\/|http:\/\/(127\.0\.0\.1|localhost)[:\/])[^\s]+$/.test(u)||rm.length<8||!nm){toast('Need an https database URL, a code of 8+ letters/numbers, and your name.');break}
      SY={url:u.replace(/\/+$/,''),room:rm,me:nm,sig:{},ts:{},pby:{},other:{},last:0,err:''};saveSync();closeModal();
      try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
      toast('Connecting...');paintSync();syncNow();break}
    case 'syncnow':syncBusy=false;syncNow();toast('Syncing...');setTimeout(function(){if(!$('#modal').hidden)syncModal()},1500);break;
    case 'syncinvite':{var link=location.origin+location.pathname+'#sync='+btoa(JSON.stringify({u:SY.url,r:SY.room}));
      try{navigator.clipboard.writeText(link).then(function(){toast('Invite link copied.')},function(){prompt('Copy this link',link)})}catch(e){prompt('Copy this link',link)}break}
    case 'syncoff':SY.url='';SY.room='';SY.sig={};SY.ts={};SY.pby={};SY.other={};saveSync();closeModal();paintSync();render();toast('Disconnected. Your local data stays.');break;
    case 'pick':pickModal(d.day);break;
    case 'assign':setPlan(S.pickDay,d.id);break;
    case 'planthis':dayModal(d.id);break;
    case 'assignday':setPlan(d.day,S.planRecipe);break;
    case 'unplan':delete store.plan[d.day];saveStore();render();break;
    case 'surprise':{var used={};nextDays(14).forEach(function(x){if(store.plan[x.key])used[store.plan[x.key]]=1});
      var all=allRecipes(),pool=all.filter(function(r){return !used[r.id]}),fp=pool.filter(function(r){return store.favs.indexOf(r.id)>=0});
      if(!pool.length)pool=all;var pl=(fp.length&&Math.random()<0.5)?fp:pool;setPlan(d.day,pl[Math.floor(Math.random()*pl.length)].id);break}
    case 'bkcopy':{var ta=$('#bk');ta.select();var done=function(){toast('Copied.')};
      try{navigator.clipboard.writeText(ta.value).then(done,function(){try{document.execCommand('copy');done()}catch(e){toast('Press and hold the text to copy.')}})}catch(e){try{document.execCommand('copy');done()}catch(e2){toast('Press and hold the text to copy.')}}break}
    case 'bkdl':{var bl=new Blob([JSON.stringify(store)],{type:'application/json'}),a2=document.createElement('a');a2.href=URL.createObjectURL(bl);a2.download='global-flavours-backup.json';document.body.appendChild(a2);a2.click();a2.remove();break}
    case 'bkimp':{try{var o=JSON.parse($('#bki').value);if(!o||typeof o!=='object'||!Array.isArray(o.added))throw 0;
        store.edits=o.edits||{};store.added=o.added;store.deleted=o.deleted||[];store.favs=o.favs||[];store.plan=o.plan||{};saveStore();closeModal();S.view='library';render();toast('Backup restored.')}catch(e){toast('That text is not a valid backup.')}break}
    case 'undel':store.deleted=[];saveStore();closeModal();render();toast('Deleted recipes are back.');break;
    case 'cook':startCook(d.id);break;
    case 'cookexit':exitCook();break;
    case 'cnext':if(S.cook){S.cook.i++;renderCook()}break;
    case 'cprev':if(S.cook&&S.cook.i>0){S.cook.i--;renderCook()}break;
    case 'drawer':if(S.cook){S.cook.drawer=!S.cook.drawer;renderCook()}break;
    case 'wake':if(wl){wakeOff()}else{wakeOn()}setTimeout(paintWake,300);break;
    case 'timer':addTimer(+d.sec,d.label);toast('Timer started: '+d.label);break;
    case 'tadd':T.forEach(function(t){if(String(t.id)===d.id){t.end+=60000;t.done=false;t.beeps=0}});drawTray();break;
    case 'tdel':T=T.filter(function(t){return String(t.id)!==d.id});drawTray();break;
  }
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(t){act(t.dataset.act,t.dataset,t);return}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.chk!==undefined&&S.id){
    var c=S.checks[S.id]=S.checks[S.id]||[];c[+t.dataset.chk]=t.checked;
    document.querySelectorAll('[data-chk="'+t.dataset.chk+'"]').forEach(function(x){x.checked=t.checked});
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderGrid()}
  else if(e.target.id==='pq')drawPick(e.target.value);
});
document.addEventListener('keydown',function(e){
  if(!S.cook)return;
  if(e.key==='ArrowRight')act('cnext',{});
  else if(e.key==='ArrowLeft')act('cprev',{});
  else if(e.key==='Escape')exitCook();
});
var tx=null;
document.addEventListener('touchstart',function(e){tx=(S.cook&&!S.cook.drawer&&e.touches.length===1)?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',function(e){
  if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>90){act(dx<0?'cnext':'cprev',{})}
},{passive:true});

render();paintSync();
(function(){var m=/#sync=([A-Za-z0-9+\/=]+)/.exec(location.hash||'');
  if(m&&!syncOn()){try{var j=JSON.parse(atob(m[1]));syncModal({u:j.u,r:j.r})}catch(e){}}
  else if(syncOn())setTimeout(syncNow,300)})();
})();
</script>

<script>window.__PWA=1;if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
