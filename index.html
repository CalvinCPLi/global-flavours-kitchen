<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#1a1215" media="(prefers-color-scheme: dark)">

<title>Bubu's Kitchen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a library of recipe cards, a two-column recipe sheet, and a full-screen cook mode with big type, timers and a pan check. */
:root{
  --bg:#fbf1f2; --surface:#fffafa; --surface2:#f4e1e4; --ink:#2a1a1e; --muted:#6d5459;
  --line:#e6cdd2; --accent:#be185d; --accent-ink:#ffffff; --good:#2b7a4b; --warn:#a15c00;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1215; --surface:#231a1d; --surface2:#2e2226; --ink:#f8eef0; --muted:#b79ea4;
  --line:#46343a; --accent:#ff8fb1; --accent-ink:#2a0d17; --good:#6cc58c; --warn:#e8b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1215; --surface:#231a1d; --surface2:#2e2226; --ink:#f8eef0; --muted:#b79ea4;
  --line:#46343a; --accent:#ff8fb1; --accent-ink:#2a0d17; --good:#6cc58c; --warn:#e8b04a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 1.125rem/1.5 var(--body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding-block:.6rem}
.brand{font:800 1.35rem/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font:500 .7rem/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.25rem}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.65rem 1.1rem;min-height:48px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.6rem 1.1rem;border-radius:12px;
  border:1.5px solid var(--ink);background:transparent;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:64px;font-size:1.3rem;padding-inline:1.6rem;border-radius:16px}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.sm{min-height:40px;padding:.3rem .8rem;font-size:.95rem}
.btn[disabled]{opacity:.4}
.icon-btn{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

/* library */
.tools{display:flex;flex-direction:column;gap:.8rem;padding-block:1.2rem .6rem}
.search{width:100%;min-height:54px;padding:.7rem 1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{min-height:44px;padding:.4rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font:500 .85rem var(--mono);padding-block:.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:.9rem;padding-bottom:6rem}
.card{display:flex;flex-direction:column;gap:.5rem;text-align:left;padding:1rem 1.1rem;min-height:150px;min-width:0;border:1.5px solid var(--line);
  border-radius:14px;background:var(--surface)}
.card h2{font-size:1.3rem}
.card .m{color:var(--muted);font-size:.95rem}
.card .tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto}
.tag{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:.15rem .45rem;color:var(--muted)}
.tag.new{border-color:var(--accent);color:var(--accent)}
.tag.veg{border-color:var(--good);color:var(--good)}
.empty{padding:3rem 0;color:var(--muted);text-align:center}

/* recipe */
.rhead{display:flex;flex-direction:column;gap:.9rem;padding-block:1.2rem .6rem}
.rtop{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.rtop .sp{margin-right:auto}
.rhead h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.015em}
.facts{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--mono);font-weight:500}
.srcs{font-size:.95rem;color:var(--muted)}
.cols{display:grid;gap:1.6rem 2.4rem;padding-block:1rem 8rem}
@media (min-width:860px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.panel{min-width:0}
.panel>h3{font:500 .8rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:.5rem;border-bottom:1.5px solid var(--ink);margin-bottom:.4rem}
.stepper{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:.2rem}
.stepper button{width:48px;height:44px;border:0;border-radius:9px;background:var(--surface2);font-size:1.4rem;font-weight:700}
.stepper output{min-width:5.5rem;text-align:center;font-weight:700}
ul.ings{list-style:none;margin:0;padding:0}
.ings li{border-bottom:1px solid var(--line)}
.ings label{display:flex;gap:.9rem;align-items:flex-start;padding:.75rem .2rem;min-height:52px;cursor:pointer}
.ings input{width:26px;height:26px;margin:.1rem 0 0;flex:none;accent-color:var(--accent)}
.ings input:checked+span{color:var(--muted);text-decoration:line-through}
.ings.big label{padding:1rem .3rem;font-size:1.35rem}
.ings.big input{width:32px;height:32px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.6rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);font:500 1.1rem var(--mono);color:var(--accent)}
.note{margin-top:1rem;padding:1rem 1.1rem;border-radius:12px;background:var(--surface2)}
.note h4{margin:0 0 .35rem;font:500 .8rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note p{margin:.3rem 0}
.note.pan{border-left:6px solid var(--accent);border-radius:6px 12px 12px 6px}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:.8rem max(16px,env(safe-area-inset-right,0px)) calc(.8rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* guide */
.guide{display:grid;gap:1rem;padding-block:1.2rem 5rem}
.gcard{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:1.1rem 1.3rem;min-width:0}
.gcard h2{font-size:1.5rem;margin-bottom:.6rem}
.gcard h3{font:700 1.05rem var(--display);margin:1rem 0 .2rem}
.gcard p{margin:.35rem 0}
.gcard ol,.gcard ul{padding-left:1.3rem;margin:.4rem 0}
.gcard li{margin:.45rem 0}
.gcard table{width:100%;border-collapse:collapse;font-size:1rem}
.gcard td,.gcard th{text-align:left;vertical-align:top;padding:.55rem .5rem;border-top:1px solid var(--line)}
.gcard th{font:500 .75rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0}
.scroll{overflow-x:auto}
.wt{width:100%;max-width:520px;height:auto;display:block;margin:.6rem 0}
.wt .pn{fill:var(--surface2);stroke:var(--ink);stroke-width:3}
.wt .dr{fill:var(--accent);opacity:.9}
.wt text{fill:var(--ink);font:700 14px var(--body)}
.wt .ln{stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}

/* forms */
.form{display:grid;gap:1rem;padding-block:1.2rem 6rem;max-width:860px}
.field{display:grid;gap:.35rem}
.field label{font:500 .78rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:.7rem .9rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;min-height:48px}
.field textarea{min-height:11rem;line-height:1.45;resize:vertical}
.row{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.hint{color:var(--muted);font-size:.9rem}
.check{display:flex;align-items:center;gap:.7rem;min-height:48px}
.check input{width:26px;height:26px;accent-color:var(--accent)}
.actions{display:flex;gap:.7rem;flex-wrap:wrap}
.notice{padding:.7rem 1rem;border-radius:12px;background:var(--surface2);color:var(--ink);margin-top:.8rem;font-size:.95rem}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,14,17,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1rem calc(1.5rem + env(safe-area-inset-bottom,0px))}
.sheet{width:min(100%,720px);background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:1.3rem;display:grid;gap:1rem}
.sheet h2{font-size:1.6rem}
.sheet textarea{width:100%;min-height:10rem;padding:.7rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 .85rem/1.4 var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6.5rem + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);
  padding:.8rem 1.2rem;border-radius:12px;font-weight:700;max-width:90vw}

/* timers */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:75;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;
  padding:.5rem max(16px,env(safe-area-inset-right,0px)) calc(.5rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
body.cooking .tray{bottom:calc(92px + env(safe-area-inset-bottom,0px));padding-bottom:.5rem}
.tm{pointer-events:auto;display:flex;align-items:center;gap:.7rem;background:var(--ink);color:var(--bg);border-radius:14px;padding:.45rem .5rem .45rem 1rem;box-shadow:0 4px 18px #0006}
.tm .tl{font-size:.9rem;max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .tt{font:500 1.6rem var(--mono);font-variant-numeric:tabular-nums}
.tm button{min-width:44px;min-height:44px;border-radius:10px;border:0;background:rgba(127,127,127,.3);color:inherit;font-weight:700}
.tm.done{background:var(--accent);color:var(--accent-ink);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.04)}}

/* cook mode */
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.chead{display:flex;align-items:center;gap:.7rem;padding-block:.6rem;border-bottom:1px solid var(--line)}
.chead .ti{margin-right:auto;min-width:0}
.chead .ti b{display:block;font:800 1.15rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ti span{font:500 .8rem var(--mono);color:var(--muted)}
.prog{display:flex;gap:4px;padding-block:.5rem}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.prog i.on{background:var(--accent)}
.cbody{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;padding-block:1rem;max-width:980px;width:100%;margin:0 auto}
.cbody .kick{font:500 .9rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.cbody .big{font:400 clamp(1.7rem,3.6vw,3rem)/1.32 var(--body);text-wrap:pretty;margin:0}
.cbody .next{color:var(--muted);font-size:1.05rem;border-top:1px solid var(--line);padding-top:.8rem}
.tbtns{display:flex;gap:.6rem;flex-wrap:wrap}
.tbtns .btn{min-height:60px;font-size:1.2rem}
.cnav{display:flex;gap:.8rem;padding-block:.8rem;min-height:92px}
.cnav .btn{flex:1;min-height:72px;font-size:1.4rem;border-radius:16px}
.cnav .btn:first-child{flex:.6}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(100%,460px);background:var(--surface);border-left:1.5px solid var(--line);z-index:5;
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1.2rem 1.2rem;overflow:auto;box-shadow:-8px 0 30px #0004}
.drawer h2{font-size:1.4rem;margin-bottom:.5rem}
@media (prefers-reduced-motion:reduce){.tm.done{animation:none}}
.dedic{margin:.2rem 0 1rem;padding:1rem 1.2rem;border:1.5px solid var(--accent);border-radius:18px;background:var(--surface);display:flex;gap:.9rem;align-items:center}
.dedic .hh{font-size:2rem;line-height:1;color:var(--accent)}
.dedic b{font-weight:800;font-size:1.15rem;display:block}
.dedic span{color:var(--muted);font-size:.98rem}
.kick.love{color:var(--accent)}
.plan{display:grid;gap:.7rem;margin:1rem 0 5rem}
.prow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.8rem 1rem;border:1.5px solid var(--line);border-radius:16px;background:var(--surface)}
.pday{min-width:8.5rem;display:grid;line-height:1.2}.pday b{font-weight:800}.pday span{color:var(--muted);font-size:.9rem}
.pname{flex:1;min-width:10rem;text-align:left;background:none;border:0;color:var(--ink);font:700 1.1rem var(--body);padding:.4rem 0;display:grid;gap:.1rem;cursor:pointer}
.pname small{color:var(--muted);font-weight:400;font-size:.9rem}.pname.empty{color:var(--muted);font-weight:400;cursor:default}
.plist{display:grid;gap:.5rem;max-height:55vh;overflow:auto}
.pitem{display:grid;gap:.1rem;text-align:left;padding:.8rem 1rem;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.pitem small{color:var(--muted)}
button.dedic{width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.dedic .hh,button.dedic span{color:var(--accent-ink)}
</style>

</head>
<body>
<div id="app">
  <header class="bar wrap">
    <div class="brand">Bubu's Kitchen <span aria-hidden="true" style="color:var(--accent)">♥</span><small>Cooked with love · stainless pan edition</small></div>
    <div class="seg" role="group" aria-label="Section">
      <button type="button" id="nav-library" data-act="nav" data-v="library" aria-pressed="true">Recipes</button>
      <button type="button" id="nav-plan" data-act="nav" data-v="plan" aria-pressed="false">Plan</button>
      <button type="button" id="nav-guide" data-act="nav" data-v="guide" aria-pressed="false">Guide</button>
    </div>
    <button type="button" class="btn" data-act="new">+ New</button>
    <button type="button" class="btn" data-act="syncmodal" id="sync-btn">Sync</button>
    <button type="button" class="btn" data-act="backup">Backup</button>
  </header>
  <main id="view" class="wrap"></main>
</div>
<div id="cook" class="cook" hidden></div>
<div id="tray" class="tray" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const BUILTIN=[{"id":"r1","name":"Black Pepper Beef & Peppers","cuisine":"Chinese-inspired","time":25,"servings":2,"kcal":390,"protein":38,"main":"red","veg":false,"ingredients":["300 g lean beef steak, thinly sliced","1 bell pepper, sliced","1 small onion, sliced","2 garlic cloves, minced","1 tbsp light soy sauce","1 tsp dark soy sauce (optional)","1 tbsp oyster sauce","1 tsp coarsely cracked black pepper","1 tsp cornflour + 2 tbsp water","1 tsp neutral oil"],"steps":["Toss beef with 1 tsp soy and half the black pepper; rest while slicing vegetables.","Heat a wok or large pan until hot. Add oil and sear beef in a single layer in batches; remove.","Stir-fry onion and pepper for 2–3 minutes. Add garlic for 20 seconds.","Add oyster sauce, remaining soy, pepper and cornflour slurry. Return beef and toss until glossy and just cooked."],"tip":"Slice across the grain and avoid crowding the pan. Serve with a measured portion of rice; rice is not included in the nutrition estimate.","sources":[],"spicy":0},{"id":"r2","name":"Ginger-Scallion Chicken","cuisine":"Chinese-inspired","time":30,"servings":2,"kcal":410,"protein":43,"main":"poultry","veg":false,"ingredients":["350 g skinless chicken breast, sliced","3 spring onions, finely sliced","20 g fresh ginger, grated","2 garlic cloves, minced","1 tbsp light soy sauce","1 tsp oyster sauce","1 tsp sesame oil","1 tsp neutral oil","1 tsp cornflour + 2 tbsp water","150 g sugar snap peas"],"steps":["Season chicken with soy, oyster sauce and cornflour; leave for 5 minutes.","Heat neutral oil in a large pan. Sear chicken in batches until nearly cooked; remove.","Add ginger, garlic and the white parts of spring onion; stir for 30 seconds.","Add sugar snaps and 2 tbsp water; cover for 2 minutes. Return chicken, toss through sesame oil and green onion."],"tip":"Cornflour creates a light protective coating. Keep ginger fragrant rather than browned.","sources":[],"spicy":0},{"id":"r3","name":"Garlic-Chilli Chicken & Green Beans","cuisine":"Chinese-inspired","time":25,"servings":2,"kcal":370,"protein":42,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, bite-size pieces","250 g green beans, trimmed","3 garlic cloves, minced","1 tsp grated ginger","1 tbsp soy sauce","1 tbsp rice vinegar","1 tsp honey","1 tsp chilli crisp or chilli flakes","1 tsp neutral oil","1 tsp cornflour mixed with 2 tbsp water"],"steps":["Mix soy, vinegar, honey and cornflour slurry in a small bowl.","Sear chicken in oil over medium-high heat until golden and almost cooked; remove.","Stir-fry green beans with 2 tbsp water for 3–4 minutes, then add garlic and ginger.","Return chicken, add sauce and chilli, and toss until thickened and chicken is cooked through."],"tip":"Use chilli crisp sparingly if calorie tracking; it can contain substantial oil.","sources":[],"spicy":1},{"id":"r4","name":"Lemon-Parmesan Chicken","cuisine":"Italian-inspired","time":30,"servings":2,"kcal":430,"protein":46,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, butterflied","1 lemon: zest and 2 tbsp juice","20 g Parmesan, finely grated","100 ml reduced-salt chicken stock","1 tsp olive oil","1 tsp butter","2 garlic cloves, minced","1 tsp dried oregano","150 g spinach","Black pepper"],"steps":["Season chicken with pepper and oregano. Heat oil in a pan and sear 3–5 minutes per side, until cooked; set aside.","Lower heat; add butter and garlic and stir for 30 seconds.","Add stock, lemon zest and juice; simmer 2 minutes, scraping up browned bits.","Stir in Parmesan and spinach until wilted. Return chicken and spoon sauce over it."],"tip":"For a smooth sauce, keep the pan below a hard boil after adding Parmesan.","sources":[],"spicy":0},{"id":"r5","name":"Ginger-Soy Pork with Mushrooms","cuisine":"East Asian-inspired","time":25,"servings":2,"kcal":390,"protein":36,"main":"red","veg":false,"ingredients":["300 g lean pork tenderloin, thinly sliced","200 g mushrooms, sliced","1 tsp grated ginger","2 garlic cloves, minced","1 tbsp soy sauce","1 tbsp mirin","1 tsp rice vinegar","1 tsp sesame oil","1 tsp neutral oil","2 spring onions"],"steps":["Stir soy, mirin and vinegar together.","Sear pork in neutral oil in batches; remove as soon as lightly browned.","Add mushrooms and cook until their liquid evaporates and edges brown.","Add ginger and garlic for 30 seconds, return pork and pour in sauce. Toss briefly, finish with sesame oil and spring onions."],"tip":"Pork tenderloin cooks quickly; avoid leaving it in the pan while the mushrooms brown.","sources":[],"spicy":0},{"id":"r6","name":"Turkey Kofta with Lemon Yogurt","cuisine":"Mediterranean","time":30,"servings":2,"kcal":420,"protein":43,"main":"poultry","veg":false,"ingredients":["350 g lean turkey mince","1 small garlic clove, grated","1 tsp ground cumin","1 tsp smoked paprika","2 tbsp chopped parsley","100 g 0% Greek yogurt","1/2 lemon, zest and juice","1/2 cucumber, diced","1 tsp olive oil","Salt and pepper"],"steps":["Mix turkey, garlic, cumin, paprika, parsley, salt and pepper. Shape into 8 small kofta.","Mix yogurt with lemon zest, a little juice, cucumber and pepper.","Heat oil in a pan; cook kofta 10–12 minutes, turning, until browned and cooked through.","Serve with lemon yogurt and extra parsley; add salad or flatbread as desired."],"tip":"Wet hands make shaping easier. Cook poultry mince to 74°C internally.","sources":[],"spicy":0},{"id":"r7","name":"Beef & Broccoli","cuisine":"Chinese-American classic","time":25,"servings":2,"kcal":400,"protein":37,"main":"red","veg":false,"ingredients":["300 g lean beef, thinly sliced","300 g broccoli florets","2 garlic cloves, minced","1 tsp grated ginger","1 tbsp soy sauce","1 tbsp oyster sauce","100 ml water or stock","1 tsp cornflour + 1 tbsp water","1 tsp neutral oil"],"steps":["Blanch broccoli in boiling water for 2 minutes; drain well.","Sear beef in a very hot pan in batches; remove.","Add garlic and ginger for 20 seconds, then water, soy and oyster sauce.","Add broccoli and beef. Stir in cornflour slurry and toss until sauce lightly coats everything."],"tip":"Blanching broccoli first preserves its colour and gives you control over tenderness.","sources":[],"spicy":0},{"id":"r8","name":"Chicken Piccata","cuisine":"Italian-American","time":25,"servings":2,"kcal":410,"protein":45,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, sliced horizontally","1 tbsp plain flour","100 ml chicken stock","1 lemon, juice and zest","1 tbsp capers, rinsed","1 tsp olive oil","1 tsp butter","1 garlic clove, minced","Parsley and black pepper"],"steps":["Season chicken and dust lightly with flour; shake off excess.","Sear in olive oil 3–4 minutes per side, until cooked; set aside.","Add garlic, stock, lemon juice and capers. Simmer 2–3 minutes, scraping the pan.","Turn off heat and whisk in butter and lemon zest. Return chicken and finish with parsley."],"tip":"The butter goes in off the heat to give the sauce a glossy finish.","sources":[],"spicy":0},{"id":"r9","name":"Greek Chicken & Chickpea Bowls","cuisine":"Mediterranean","time":30,"servings":2,"kcal":510,"protein":48,"main":"poultry","veg":false,"ingredients":["300 g chicken breast, cubed","240 g drained chickpeas","1 cucumber, chopped","200 g cherry tomatoes, halved","100 g 0% Greek yogurt","1/2 lemon","1 tsp dried oregano","1 tsp olive oil","1 small garlic clove","15 g feta (optional)"],"steps":["Season chicken with oregano, salt, pepper and olive oil. Sear until golden and cooked through.","Mix yogurt, lemon juice and grated garlic to make a quick sauce.","Toss chickpeas, cucumber and tomatoes with lemon juice, pepper and a pinch of salt.","Divide salad and chickpeas into bowls, add chicken and yogurt sauce; crumble over feta if using."],"tip":"Keep the cucumber and tomato raw for contrast. Nutrition includes chickpeas and yogurt but excludes optional feta.","sources":[],"spicy":0},{"id":"r10","name":"Garlic Prawns with White Beans","cuisine":"Spanish-inspired","time":20,"servings":2,"kcal":390,"protein":38,"main":"fish","veg":false,"ingredients":["300 g peeled raw prawns","1 can cannellini beans, drained (240 g)","3 garlic cloves, thinly sliced","1 tsp olive oil","1/2 tsp smoked paprika","1/2 lemon","100 g spinach","Parsley and chilli flakes"],"steps":["Pat prawns dry. Warm oil in a pan and gently cook garlic until fragrant, not brown.","Add paprika and prawns; cook 1–2 minutes per side until opaque.","Add drained beans and 2 tbsp water; warm through, then fold in spinach until wilted.","Finish with lemon juice, parsley and chilli. Taste before adding salt."],"tip":"Prawns turn rubbery when overcooked. Beans add fibre and make this a complete quick meal.","sources":[],"spicy":0},{"id":"r11","name":"Mushroom & White Bean Skillet","cuisine":"European","time":25,"servings":2,"kcal":360,"protein":22,"main":"veg","veg":true,"ingredients":["300 g mushrooms, sliced","1 can cannellini beans, drained (240 g)","150 g spinach","2 garlic cloves, minced","150 ml vegetable stock","1 tsp olive oil","1 tsp Dijon mustard","15 g Parmesan","1/2 lemon","Thyme and black pepper"],"steps":["Brown mushrooms in oil in a wide pan, working in batches if needed.","Add garlic and thyme for 30 seconds; stir in mustard and stock.","Add beans and simmer 5 minutes to reduce the liquid slightly.","Fold in spinach and Parmesan; finish with lemon and black pepper."],"tip":"For a higher-protein meal, serve with a side of skyr or add edamame.","sources":[],"spicy":0},{"id":"r12","name":"Crispy Tofu & Broccoli","cuisine":"Chinese-inspired","time":30,"servings":2,"kcal":390,"protein":27,"main":"veg","veg":true,"ingredients":["400 g extra-firm tofu, pressed and cubed","300 g broccoli florets","1 tbsp soy sauce","1 tbsp cornflour","1 tsp neutral oil","1 tbsp hoisin sauce","1 tsp rice vinegar","1 tsp grated ginger","1 garlic clove","1 tsp sesame seeds"],"steps":["Pat tofu very dry, toss with soy and cornflour. Pan-sear in oil until crisp on several sides; remove.","Steam-fry broccoli with 2 tbsp water for 3 minutes; uncover to evaporate water.","Add ginger and garlic for 20 seconds. Mix hoisin, vinegar and 1 tbsp water.","Return tofu, add sauce and toss briefly. Finish with sesame seeds."],"tip":"Do not move tofu too early; a crust forms when it has contact with the hot pan.","sources":[],"spicy":0},{"id":"r13","name":"Japanese Salmon Teriyaki","cuisine":"Japanese-inspired","time":25,"servings":2,"kcal":480,"protein":36,"main":"fish","veg":false,"ingredients":["2 salmon fillets, 150 g each","2 tbsp soy sauce","2 tbsp mirin","1 tbsp sake or water","1 tsp sugar","1 tsp neutral oil","1 tsp sesame seeds","Spring onion","200 g broccoli"],"steps":["Stir soy, mirin, sake and sugar together.","Pat salmon dry. Sear skin-side down in oil over medium heat for 4–5 minutes; turn and cook until just done.","Lower heat, pour off excess oil if needed, and add sauce. Bubble gently until glossy, spooning over fish.","Serve with steamed broccoli, sesame and spring onion."],"tip":"Teriyaki reduces quickly; keep the heat moderate so the sugar does not burn. Nutrition excludes rice.","sources":[],"spicy":0},{"id":"r14","name":"Gochujang Chicken Rice Bowls","cuisine":"Korean-inspired","time":30,"servings":2,"kcal":470,"protein":43,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, sliced","1 tbsp gochujang","1 tbsp soy sauce","1 tbsp rice vinegar","1 tsp honey","1 garlic clove, minced","1 tsp neutral oil","250 g cucumber","150 g cooked rice total","Sesame seeds and spring onion"],"steps":["Mix gochujang, soy, vinegar, honey and garlic with 1 tbsp water.","Sear chicken in oil until golden and nearly cooked.","Add sauce and toss over medium-low heat until chicken is cooked and coated.","Serve with cucumber and rice; garnish with spring onion and sesame."],"tip":"Gochujang brands vary in salt and heat. Taste the sauce before adding extra soy.","sources":[],"spicy":1},{"id":"r15","name":"Mapo Tofu, Weeknight Style","cuisine":"Sichuan-inspired","time":30,"servings":2,"kcal":390,"protein":29,"main":"red","veg":false,"ingredients":["400 g soft or medium tofu, cubed","150 g lean pork or turkey mince","1 tbsp doubanjiang (chilli bean paste)","2 garlic cloves, minced","1 tsp ginger, minced","200 ml stock or water","1 tsp soy sauce","1 tsp cornflour + 2 tbsp water","1 tsp Sichuan pepper, toasted and ground","Spring onion"],"steps":["Warm a pan and brown mince thoroughly, breaking it into small pieces.","Add doubanjiang, garlic and ginger; fry for 30–45 seconds until aromatic.","Add stock, soy and tofu. Simmer gently for 5–7 minutes without aggressively stirring.","Add cornflour slurry and simmer until lightly thickened. Finish with Sichuan pepper and spring onion."],"tip":"Doubanjiang is salty and powerful; start with less if unfamiliar. For a more traditional flavour, use Sichuan peppercorns.","sources":[],"spicy":2},{"id":"r16","name":"Japanese Miso-Ginger Salmon","cuisine":"Japanese-inspired","time":25,"servings":2,"kcal":460,"protein":36,"main":"fish","veg":false,"ingredients":["2 salmon fillets, 150 g each","1 tbsp white miso","1 tbsp mirin","1 tsp soy sauce","1 tsp grated ginger","1 tsp honey","250 g pak choi","1 tsp neutral oil","1/2 lime"],"steps":["Mix miso, mirin, soy, ginger and honey into a paste; coat the salmon.","Sear salmon in a lightly oiled pan, then turn and cook until just done. If the paste darkens too quickly, lower the heat.","In a second pan, sear halved pak choi cut-side down; add a splash of water and cover briefly.","Serve salmon with pak choi and lime. Nutrition excludes rice."],"tip":"Miso contains salt, so taste before adding any extra seasoning.","sources":[],"spicy":0},{"id":"r17","name":"Thai Basil Chicken","cuisine":"Thai-inspired","time":25,"servings":2,"kcal":380,"protein":42,"main":"poultry","veg":false,"ingredients":["350 g chicken mince","3 garlic cloves","1–2 red chillies","1 tbsp oyster sauce","1 tbsp light soy sauce","1 tsp fish sauce","1 tsp sugar","1 tsp neutral oil","1 large handful Thai holy basil","1 red bell pepper, thinly sliced"],"steps":["Pound or finely chop garlic and chilli. Mix oyster sauce, soy, fish sauce and sugar.","Heat oil in a wok until hot. Fry garlic and chilli briefly, then add chicken mince.","Stir-fry, breaking up the mince, until cooked and lightly browned. Add pepper and sauce.","Turn off the heat and fold in basil until just wilted."],"tip":"Holy basil is traditional; Thai sweet basil is a workable substitute but tastes different. Serve with rice and a fried egg if desired.","sources":[],"spicy":1},{"id":"r18","name":"Vietnamese Lemongrass Pork","cuisine":"Vietnamese-inspired","time":30,"servings":2,"kcal":400,"protein":36,"main":"red","veg":false,"ingredients":["300 g lean pork tenderloin, thinly sliced","2 tbsp finely chopped lemongrass","2 garlic cloves, minced","1 tbsp fish sauce","1 tsp soy sauce","1 tsp honey","1 tsp neutral oil","1/2 cucumber","1 carrot, grated","Lime and coriander"],"steps":["Mix pork with lemongrass, garlic, fish sauce, soy and honey; marinate while preparing vegetables.","Sear pork in a hot pan in batches until browned and cooked through.","Toss cucumber and carrot with lime juice and chopped coriander.","Serve pork over salad or rice noodles, with extra lime."],"tip":"Use only the tender inner lemongrass and mince it very finely to avoid fibrous pieces.","sources":[],"spicy":0},{"id":"r19","name":"Malaysian-Style Quick Chicken Curry","cuisine":"Malaysian-inspired","time":35,"servings":2,"kcal":450,"protein":42,"main":"poultry","veg":false,"ingredients":["350 g chicken breast or thigh, cubed","1 tbsp Malaysian curry paste","200 ml light coconut milk","150 g green beans","1 small onion, sliced","1 tsp neutral oil","1 tsp fish sauce","1/2 lime","Coriander"],"steps":["Heat oil and fry curry paste with onion for 1–2 minutes until fragrant.","Add chicken and toss to coat; cook until the outside turns opaque.","Pour in coconut milk and 100 ml water. Simmer gently until chicken is cooked through.","Add green beans for the final 4–5 minutes. Season with fish sauce and lime; garnish with coriander."],"tip":"Check the paste label for heat and salt. Use light coconut milk for a lighter sauce; nutrition excludes rice.","sources":[],"spicy":0},{"id":"r20","name":"Indonesian-Style Chicken Satay Bowls","cuisine":"Indonesian-inspired","time":30,"servings":2,"kcal":490,"protein":44,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, strips","1 tsp curry powder","1 tsp soy sauce","1 tsp neutral oil","30 g peanut butter","1 tbsp soy sauce","1 tbsp lime juice","1 tsp honey","60–90 ml warm water","Cucumber and coriander"],"steps":["Season chicken with curry powder, 1 tsp soy and oil. Sear in a pan until golden and cooked.","Whisk peanut butter, soy, lime, honey and warm water until pourable.","Taste the sauce and adjust with lime or water; it should be savoury, nutty and tangy.","Serve chicken with cucumber, coriander and peanut sauce."],"tip":"Peanut sauce thickens as it stands; add warm water a teaspoon at a time to loosen it.","sources":[],"spicy":0},{"id":"r21","name":"Chicken Tikka Masala, Lighter","cuisine":"Indian-inspired","time":35,"servings":2,"kcal":450,"protein":48,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, cubed","100 g 0% Greek yogurt","1 tbsp tikka masala paste","200 g passata","1 small onion, finely diced","1 garlic clove, minced","1 tsp grated ginger","1 tsp oil","1 tbsp light cream (optional)","Coriander"],"steps":["Mix chicken with half the yogurt and half the curry paste; leave while chopping the onion.","Sear chicken in oil in a wide pan; it need not be fully cooked yet. Remove.","Cook onion until soft, then add garlic, ginger and remaining paste; fry for 30 seconds.","Add passata and simmer 5 minutes. Return chicken and cook through. Turn off heat and stir in remaining yogurt and optional cream."],"tip":"Take the pan off the heat before adding yogurt to reduce the chance of curdling.","sources":[],"spicy":0},{"id":"r22","name":"Quick Red Lentil Dal","cuisine":"Indian-inspired","time":30,"servings":2,"kcal":360,"protein":22,"main":"veg","veg":true,"ingredients":["150 g red lentils, rinsed","1 small onion, diced","2 garlic cloves, minced","1 tsp grated ginger","1 tsp ground cumin","1 tsp turmeric","400 ml water or light stock","100 g spinach","100 g 0% Greek yogurt, to serve","1 tsp oil","Lemon"],"steps":["Cook onion in oil for 4 minutes until softened. Add garlic, ginger, cumin and turmeric; stir for 30 seconds.","Add lentils and water. Simmer 15–18 minutes, stirring, until soft; add water if too thick.","Fold in spinach and cook until wilted. Season with salt and lemon.","Serve with yogurt. Add rice or flatbread if desired."],"tip":"Rinsing removes surface starch. Dal thickens as it rests, so keep extra hot water handy.","sources":[],"spicy":0},{"id":"r23","name":"Keema with Peas","cuisine":"Indian-inspired","time":30,"servings":2,"kcal":430,"protein":39,"main":"red","veg":false,"ingredients":["300 g lean beef or turkey mince","150 g frozen peas","1 small onion, diced","2 garlic cloves, minced","1 tsp grated ginger","1 tsp garam masala","1 tsp ground cumin","200 g passata","1 tsp oil","Coriander and lemon"],"steps":["Brown mince in a hot pan, breaking it up and allowing some edges to caramelize.","Add onion and cook until softened. Stir in garlic, ginger, cumin and garam masala for 30 seconds.","Add passata and simmer 8–10 minutes until thickened.","Add peas for the final 3 minutes. Finish with lemon and coriander."],"tip":"Let the mince brown before adding liquid; this creates a deeper savoury base.","sources":[],"spicy":0},{"id":"r24","name":"Chickpea & Spinach Curry","cuisine":"Indian-inspired","time":25,"servings":2,"kcal":370,"protein":19,"main":"veg","veg":true,"ingredients":["1 can chickpeas, drained (240 g)","200 g spinach","200 g passata","100 ml light coconut milk","1 small onion, diced","2 garlic cloves, minced","1 tsp curry powder","1 tsp grated ginger","1 tsp oil","Lemon"],"steps":["Cook onion in oil for 4 minutes. Add garlic, ginger and curry powder; stir until fragrant.","Add passata, chickpeas and coconut milk. Simmer for 10 minutes.","Fold in spinach and cook until wilted. Add a splash of water if the sauce becomes too thick.","Season with salt and lemon. Serve alone or with a measured portion of rice."],"tip":"For a higher-protein version, serve with Greek yogurt or add cubed tofu.","sources":[],"spicy":0},{"id":"r25","name":"Crispy-Skin Salmon with Green Beans","cuisine":"European","time":25,"servings":2,"kcal":450,"protein":36,"main":"fish","veg":false,"ingredients":["2 salmon fillets with skin, 150 g each","250 g green beans","1 tsp olive oil","1 tsp butter","1/2 lemon","1 garlic clove, crushed","Dill or parsley","Black pepper"],"steps":["Pat salmon skin very dry and season. Heat a pan over medium-high with oil.","Place salmon skin-side down and press gently for 15 seconds. Cook mostly on the skin side until crisp, then turn briefly to finish.","Steam or pan-cook green beans until tender-crisp; add garlic for the final minute.","Finish salmon with lemon, herbs and a small knob of butter if desired."],"tip":"A dry surface and patient contact with the pan are the secrets to crisp skin.","sources":[],"spicy":0},{"id":"r26","name":"Steak with Peppercorn Pan Sauce","cuisine":"French-inspired","time":30,"servings":2,"kcal":470,"protein":43,"main":"red","veg":false,"ingredients":["2 lean steaks, 150 g each","150 ml beef stock","1 tsp crushed peppercorns","1 tsp Dijon mustard","2 tbsp 0% Greek yogurt or 1 tbsp light cream","1 tsp oil","200 g green beans","Salt"],"steps":["Pat steaks dry, season and sear in a hot pan to your preferred doneness. Rest on a warm plate.","Pour off excess fat, leaving browned bits. Add stock and peppercorns; simmer and scrape the pan.","Whisk in mustard. Lower heat and stir in yogurt off the boil, or use light cream.","Serve sliced steak with sauce and steamed green beans."],"tip":"Resting redistributes juices. Yogurt can split if boiled, so add it at the end over low heat.","sources":[],"spicy":0},{"id":"r27","name":"Perfect Pan-Seared Chicken","cuisine":"Technique masterclass","time":25,"servings":2,"kcal":350,"protein":44,"main":"poultry","veg":false,"ingredients":["2 chicken breasts, 175 g each","1 tsp olive oil","1 garlic clove, crushed","1 sprig thyme or rosemary","1 tsp butter (optional)","Salt and black pepper","Lemon wedge"],"steps":["If thick, butterfly or gently pound chicken to an even thickness. Pat dry and season just before cooking.","Heat oil in a heavy pan over medium-high. Lay chicken away from you and leave undisturbed until golden, 4–6 minutes.","Turn, lower heat slightly, add garlic and herbs, and cook until the centre reaches 74°C.","Rest 5 minutes before slicing; squeeze over lemon and spoon over the pan juices."],"tip":"Even thickness and a dry surface matter more than a complicated marinade.","sources":[],"spicy":0},{"id":"r28","name":"Mushroom Risotto, Protein-Boosted","cuisine":"Italian-inspired","time":35,"servings":2,"kcal":460,"protein":23,"main":"veg","veg":true,"ingredients":["140 g risotto rice","250 g mushrooms, sliced","1 small onion, finely diced","600 ml hot light stock","100 g skyr or Greek yogurt","20 g Parmesan","1 tsp olive oil","1 garlic clove","Parsley and black pepper"],"steps":["Brown mushrooms in half the oil; remove. Add remaining oil and onion and cook until translucent.","Add rice and stir for 1 minute to coat the grains. Add hot stock a ladle at a time, stirring often.","Continue 18–22 minutes until creamy and rice is tender with a slight bite; add water if needed.","Fold in mushrooms, Parmesan and parsley. Off heat, stir in skyr or yogurt gently; do not boil."],"tip":"Traditional risotto uses butter and cheese; the yogurt is a lighter, nontraditional protein boost. Nutrition is approximate.","sources":[],"spicy":0},{"id":"r29","name":"Sesame Soba with Edamame","cuisine":"Japanese-inspired","time":20,"servings":2,"kcal":430,"protein":25,"main":"veg","veg":true,"ingredients":["150 g dried soba noodles","200 g shelled edamame, frozen","1 tbsp soy sauce","1 tbsp rice vinegar","1 tsp sesame oil","1 tsp tahini or sesame paste","1 tsp honey","1 carrot, julienned","Spring onion and sesame seeds"],"steps":["Cook soba according to packet instructions; add edamame for the final 3–4 minutes if appropriate.","Drain and rinse noodles briefly under cool water to remove excess starch.","Whisk soy, vinegar, sesame oil, tahini, honey and 1–2 tbsp water.","Toss noodles and edamame with sauce, carrot and spring onion. Finish with sesame seeds."],"tip":"Soba brands vary in buckwheat content and cooking time. This dish is also good cold for lunch.","sources":[],"spicy":0},{"id":"r30","name":"Tuna, White Bean & Lemon Salad","cuisine":"Mediterranean","time":15,"servings":2,"kcal":360,"protein":35,"main":"fish","veg":false,"ingredients":["2 cans tuna in water, drained (about 240 g)","1 can cannellini beans, drained (240 g)","200 g cherry tomatoes, halved","1/2 red onion, thinly sliced","1 tbsp olive oil","1 lemon","Parsley","Black pepper"],"steps":["Rinse and drain beans well. Flake tuna with a fork.","Whisk olive oil, lemon juice, black pepper and a pinch of salt.","Toss beans, tomatoes, onion, tuna and parsley gently with dressing.","Rest 5 minutes before serving so the beans absorb the dressing."],"tip":"Soak sliced onion in cold water for 5 minutes if you prefer a milder flavour.","sources":[],"spicy":0},{"id":"r31","name":"Turkey Taco Bowls","cuisine":"Mexican-inspired","time":25,"servings":2,"kcal":430,"protein":42,"main":"poultry","veg":false,"ingredients":["300 g lean turkey mince","1 tsp ground cumin","1 tsp smoked paprika","1/2 tsp oregano","1 small onion, diced","150 g black beans, drained","150 g salsa","100 g lettuce, shredded","100 g 0% Greek yogurt","1 lime"],"steps":["Brown turkey mince in a preheated stainless pan, breaking it into small pieces after the first 2 minutes.","Add onion, cumin, paprika and oregano; cook until fragrant and onion softens.","Stir in black beans and salsa; simmer 3–4 minutes until thick.","Serve over shredded lettuce with lime and Greek yogurt. Add a measured portion of rice if desired."],"tip":"Greek yogurt gives a tangy, high-protein alternative to sour cream.","sources":[],"spicy":0},{"id":"r32","name":"Harissa Chicken & Couscous","cuisine":"North African-inspired","time":25,"servings":2,"kcal":470,"protein":45,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, cubed","1 tbsp harissa paste","120 g dry couscous","150 ml hot stock or water","150 g cherry tomatoes","1 cucumber","1 tsp olive oil","1/2 lemon","100 g 0% Greek yogurt","Mint or parsley"],"steps":["Toss chicken with harissa and oil. Sear in a hot pan until browned and cooked through.","Put couscous in a bowl, pour over hot stock, cover for 5 minutes, then fluff with a fork.","Chop cucumber and tomatoes; dress with lemon juice and herbs.","Serve chicken over couscous with salad and yogurt. Add water to the couscous if dry."],"tip":"Harissa heat varies widely. Start with less paste and add more at the table.","sources":[],"spicy":1},{"id":"r33","name":"Pork Tenderloin with Mustard Yogurt Sauce","cuisine":"European","time":30,"servings":2,"kcal":390,"protein":39,"main":"red","veg":false,"ingredients":["300 g pork tenderloin, medallions","200 g green beans","100 g 0% Greek yogurt","1 tsp Dijon mustard","1/2 lemon","1 tsp olive oil","1 garlic clove, minced","Thyme and black pepper"],"steps":["Season pork medallions and sear in oil for 3–4 minutes per side, depending on thickness; cook to a safe internal temperature.","Rest pork while green beans steam or pan-cook until tender-crisp.","Mix yogurt, mustard, lemon juice, garlic and thyme.","Serve pork with beans and mustard yogurt sauce."],"tip":"Rest the pork before slicing; add yogurt sauce cold or at room temperature.","sources":[],"spicy":0},{"id":"r34","name":"Prawn & Tomato Orzo","cuisine":"Mediterranean","time":25,"servings":2,"kcal":420,"protein":34,"main":"fish","veg":false,"ingredients":["250 g peeled prawns","140 g orzo","200 g cherry tomatoes, halved","2 garlic cloves, minced","450 ml light stock","1 tsp olive oil","30 g spinach","20 g feta","Lemon and oregano"],"steps":["Heat oil in a deep pan; soften garlic for 20 seconds, then add tomatoes and oregano.","Stir in orzo and stock. Simmer, stirring often, until orzo is nearly tender; add small splashes of water as needed.","Add prawns and cook until opaque, then fold in spinach.","Finish with lemon zest, lemon juice and crumbled feta."],"tip":"Stir frequently because orzo can stick. Add prawns near the end to avoid overcooking.","sources":[],"spicy":0},{"id":"r35","name":"Miso Mushroom Udon","cuisine":"Japanese-inspired","time":20,"servings":2,"kcal":390,"protein":19,"main":"veg","veg":true,"ingredients":["400 g ready-to-use udon noodles","250 g mushrooms, sliced","150 g edamame","1 tbsp white miso","1 tbsp soy sauce","400 ml vegetable stock","1 tsp sesame oil","1 tsp grated ginger","Spring onion"],"steps":["Brown mushrooms in a pan with a little sesame oil.","Whisk miso and soy into the stock, then add ginger and pour into the pan.","Add udon and edamame; simmer gently until noodles loosen and edamame are hot.","Finish with spring onion and a few drops of sesame oil."],"tip":"Avoid boiling miso hard for a long time; dissolve it into hot broth for a rounded flavour.","sources":[],"spicy":0},{"id":"r36","name":"Korean Beef Lettuce Cups","cuisine":"Korean-inspired","time":25,"servings":2,"kcal":390,"protein":35,"main":"red","veg":false,"ingredients":["300 g lean beef mince","1 tbsp soy sauce","1 tsp gochujang","1 tsp sesame oil","2 garlic cloves, minced","1 tsp grated ginger","1 tsp honey","1 carrot, grated","1 small gem lettuce","Spring onion and sesame"],"steps":["Mix soy, gochujang, sesame oil, garlic, ginger and honey.","Brown beef mince in a hot pan, allowing some edges to caramelize.","Add sauce and stir until absorbed and glossy. Taste and adjust with water if too salty.","Spoon into lettuce leaves and top with carrot, spring onion and sesame."],"tip":"Lettuce cups make a lighter meal; add rice if you want a more substantial dinner.","sources":[],"spicy":1},{"id":"r37","name":"Chicken & Vegetable Fried Rice","cuisine":"Chinese home-cooking","time":25,"servings":2,"kcal":440,"protein":38,"main":"poultry","veg":false,"ingredients":["300 g chicken breast, small dice","300 g cold cooked rice","2 eggs","150 g frozen peas and carrots","2 spring onions","1 tbsp soy sauce","1 tsp oyster sauce","1 tsp neutral oil","1 garlic clove"],"steps":["Use chilled rice, breaking up clumps with your fingers. Beat the eggs lightly.","Sear chicken in a hot wok or large pan until cooked; remove.","Add oil and vegetables; stir-fry until hot. Push aside, scramble eggs, then add rice.","Return chicken, add soy and oyster sauce, and toss over high heat. Finish with spring onion."],"tip":"Cold, dry rice fries better than freshly cooked rice. Cool leftover rice quickly and refrigerate promptly.","sources":[],"spicy":0},{"id":"r38","name":"Lemon Spinach Parmesan Pasta","cuisine":"Italian-inspired","time":20,"servings":2,"kcal":470,"protein":25,"main":"veg","veg":true,"ingredients":["160 g dry pasta","150 g baby spinach","1 lemon, zest and 1–2 tbsp juice","2 garlic cloves, minced","100 g 0% Greek yogurt","30 g Parmesan","1 tsp olive oil","Black pepper and chilli flakes"],"steps":["Cook pasta in salted water until al dente. Reserve a mug of pasta water before draining.","Warm oil and garlic gently for 30 seconds. Add spinach and a splash of pasta water; wilt.","Turn off heat. Whisk yogurt with lemon zest, juice, Parmesan and 2 tbsp pasta water.","Toss pasta with the sauce, adding more pasta water until glossy. Season with pepper and chilli."],"tip":"Do not boil the yogurt sauce; gentle residual heat keeps it creamy. Nutrition assumes the listed pasta and yogurt amounts.","sources":[],"spicy":0},{"id":"r39","name":"One-Pan Chicken, Peppers & Butter Beans","cuisine":"Mediterranean","time":30,"servings":2,"kcal":480,"protein":48,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, strips","1 can butter beans, drained (240 g)","2 bell peppers, sliced","1 small onion, sliced","200 g passata","1 tsp olive oil","2 garlic cloves","1 tsp smoked paprika","Oregano and parsley"],"steps":["Season chicken with paprika, oregano, salt and pepper. Sear in oil until golden; remove.","Cook onion and peppers until beginning to soften; add garlic for 30 seconds.","Add passata and butter beans; simmer 5 minutes.","Return chicken and cook through. Finish with parsley and black pepper."],"tip":"Use a wide pan so the sauce reduces rather than steams. Serve with bread if desired.","sources":[],"spicy":0},{"id":"r40","name":"Quick Beef & Kimchi Noodles","cuisine":"Korean-inspired","time":20,"servings":2,"kcal":450,"protein":34,"main":"red","veg":false,"ingredients":["250 g lean beef strips","300 g fresh wheat noodles","150 g kimchi, chopped","1 tsp gochujang","1 tbsp soy sauce","1 tsp sesame oil","1 garlic clove","1 tsp neutral oil","Spring onion and sesame"],"steps":["Cook noodles according to packet instructions and drain.","Sear beef quickly in neutral oil over high heat; remove.","Add garlic and kimchi; stir-fry for 1–2 minutes. Mix gochujang with soy and 2 tbsp water.","Return beef and noodles, toss with sauce and sesame oil, and finish with spring onion."],"tip":"Kimchi and gochujang bring salt and acidity; taste before adding extra soy.","sources":[],"spicy":1},{"id":"r41","name":"Cumin Lamb & Pepper Stir-Fry","cuisine":"Chinese-inspired","time":25,"servings":2,"kcal":430,"protein":34,"main":"red","veg":false,"ingredients":["300 g lean lamb leg, thinly sliced","1 red bell pepper, sliced","1 small onion, sliced","2 tsp ground cumin","1 tsp chilli flakes","2 garlic cloves, minced","1 tbsp soy sauce","1 tsp neutral oil","Coriander"],"steps":["Pat lamb dry and toss with cumin, chilli and a little soy.","Heat a wok until hot; sear lamb in batches and remove.","Stir-fry onion and pepper until just tender; add garlic for 20 seconds.","Return lamb, add remaining soy and toss briefly. Finish with coriander."],"tip":"Thin slices and a very hot pan keep the lamb tender. Adjust chilli to taste.","sources":[],"spicy":1},{"id":"r42","name":"Baked-Feta-Style Chicken & Tomatoes","cuisine":"Mediterranean-inspired","time":30,"servings":2,"kcal":440,"protein":46,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, cubed","250 g cherry tomatoes","100 g reduced-fat feta","1 small red onion, wedges","1 tsp olive oil","1 garlic clove, minced","1 tsp oregano","150 g spinach","Lemon zest"],"steps":["Heat oven to 220°C. Toss tomatoes and onion with oil, garlic and oregano in a small baking dish.","Nestle chicken among vegetables and crumble feta over the top.","Bake 18–22 minutes, until chicken reaches 74°C and tomatoes burst.","Fold in spinach to wilt and finish with lemon zest and black pepper."],"tip":"Use a shallow dish so the tomatoes roast rather than stew. Oven time varies with chicken-piece size.","sources":[],"spicy":0},{"id":"r43","name":"Quick Shakshuka with Chickpeas","cuisine":"North African-inspired","time":25,"servings":2,"kcal":370,"protein":22,"main":"veg","veg":true,"ingredients":["4 eggs","1 can chickpeas, drained (240 g)","1 can chopped tomatoes (400 g)","1 red pepper, diced","1 small onion, diced","2 garlic cloves","1 tsp cumin","1 tsp paprika","1 tsp olive oil","Parsley and black pepper"],"steps":["Soften onion and pepper in oil for 5–6 minutes. Add garlic, cumin and paprika; stir for 30 seconds.","Add tomatoes and chickpeas. Simmer 8–10 minutes until slightly thickened.","Make four wells and crack in eggs. Cover and cook gently until whites are set.","Finish with parsley and pepper. Serve with a measured portion of bread if desired."],"tip":"Keep the sauce at a gentle simmer so the eggs cook evenly without toughening.","sources":[],"spicy":0},{"id":"r44","name":"Sesame-Garlic Chicken & Cabbage","cuisine":"East Asian-inspired","time":25,"servings":2,"kcal":390,"protein":43,"main":"poultry","veg":false,"ingredients":["350 g chicken breast, thinly sliced","300 g shredded cabbage","1 carrot, thinly sliced","2 garlic cloves","1 tsp grated ginger","1 tbsp soy sauce","1 tbsp rice vinegar","1 tsp sesame oil","1 tsp neutral oil","Sesame seeds"],"steps":["Mix soy, vinegar and 2 tbsp water.","Sear chicken in neutral oil in batches until nearly cooked; remove.","Stir-fry cabbage and carrot for 3–4 minutes, then add ginger and garlic.","Return chicken, add sauce and toss until cooked through. Finish with sesame oil and sesame seeds."],"tip":"Keep cabbage slightly crisp for texture. Slice chicken evenly so it cooks quickly.","sources":[],"spicy":0},{"id":"n1","name":"Chicken Shawarma Bowls","cuisine":"Middle Eastern","time":30,"servings":2,"kcal":310,"protein":47,"main":"poultry","veg":false,"isNew":true,"ingredients":["350 g chicken breast or boneless thigh, sliced","60 g 0% Greek yogurt (marinade)","2 garlic cloves, grated","1 tsp ground cumin","1 tsp ground coriander","1 tsp smoked paprika","1/2 tsp turmeric","1/2 lemon, zest and juice","1 tsp olive oil","100 g 0% Greek yogurt (garlic sauce)","1 cucumber, diced","150 g cherry tomatoes, halved","1/2 red onion, thinly sliced","100 g salad leaves","Parsley, salt and pepper"],"steps":["Mix the marinade yogurt, half the garlic, all the spices, lemon zest, 1 tsp lemon juice and a pinch of salt. Coat the chicken and marinate at least 15 minutes (overnight in the fridge is better).","Stir the remaining yogurt with the rest of the garlic, a squeeze of lemon, pepper and a splash of water until pourable. Toss cucumber, tomatoes, onion and leaves with lemon juice.","Add the oil to the preheated pan. Cook the chicken in two batches, one layer, without moving it for 3 minutes. Turn and cook 2–3 minutes more until 74°C inside.","Rest the chicken 3 minutes. Serve over the salad with the garlic yogurt and parsley. Add a measured portion of rice or flatbread if you like."],"tip":"Yogurt marinades brown fast. Shake off the excess, keep the heat at medium, and do not crowd the pan. Nutrition is an estimate for chicken breast and excludes rice.","pan":"Preheat the empty pan on medium for 2–3 minutes, do the water test, then add oil.\nShake excess marinade off the chicken: the yogurt sugars scorch on stainless if the heat is too high.\nTwo batches, one layer. The chicken lets go of the pan by itself once browned.","sources":[{"name":"themediterraneandish.com","url":"https://www.themediterraneandish.com/chicken-shawarma-salad-bowls/"},{"name":"yorkshirepudd.co.uk","url":"https://www.yorkshirepudd.co.uk/chicken-shawarma-rice-bowls/"}],"spicy":0},{"id":"n2","name":"Beef Bulgogi Skillet","cuisine":"Korean","time":25,"servings":2,"kcal":300,"protein":33,"main":"red","veg":false,"isNew":true,"ingredients":["300 g lean beef sirloin, very thinly sliced","1/2 small pear, grated","2 tbsp soy sauce","2 tsp brown sugar","1 tsp sesame oil","3 garlic cloves, grated","1 tsp grated ginger","1 tsp gochujang (optional)","1 small onion, thinly sliced","1 carrot, julienned","2 spring onions, sliced","1 tsp neutral oil","Sesame seeds"],"steps":["Freeze the beef for 20–30 minutes so it slices paper-thin, then slice across the grain.","Mix pear, soy, sugar, sesame oil, garlic, ginger and gochujang. Toss with the beef and marinate at least 30 minutes, up to 3 hours.","Add oil to the preheated pan. Cook the beef in 2–3 batches, one layer, 1–2 minutes per batch until browned at the edges. Move each batch to a plate.","Cook onion and carrot 2–3 minutes. Return the beef with any juices, add spring onion and toss 1 minute. Finish with sesame seeds; serve with rice or lettuce leaves."],"tip":"Do not overcook the beef. If the marinade blackens between batches, pour in 2 tbsp water, scrape, tip it out and carry on. Nutrition is an estimate and excludes rice.","pan":"Preheat the empty pan on medium-high, water test, then oil.\nThe sugar in this marinade caramelises quickly: medium-high is the ceiling, not full heat.\nIf the fond turns black between batches, deglaze with a splash of water and wipe the pan.","sources":[{"name":"100daysofrealfood.com","url":"https://www.100daysofrealfood.com/beef-bulgogi/"},{"name":"theeastcoastkitchen.com","url":"https://theeastcoastkitchen.com/beef-bulgogi-that-cooks-in-minutes"}],"spicy":1},{"id":"n3","name":"Prawn Pad Thai","cuisine":"Thai","time":30,"servings":2,"kcal":520,"protein":38,"main":"fish","veg":false,"isNew":true,"ingredients":["150 g flat rice noodles","250 g peeled raw prawns","2 eggs, beaten","100 g firm tofu, cubed","2 garlic cloves, minced","1 shallot, sliced","100 g bean sprouts","3 spring onions, sliced","20 g roasted peanuts, chopped","1 lime, in wedges","2 tbsp fish sauce","1 tbsp tamarind paste","1 tbsp brown sugar","1 tsp chilli flakes","3 tbsp water","1 tbsp neutral oil"],"steps":["Soak the noodles in hot (not boiling) water for about 8 minutes until bendy but still firm. Drain. Mix fish sauce, tamarind, sugar, chilli flakes and water.","Add half the oil to the preheated pan. Fry the tofu 4–5 minutes until crisp, turning once. Remove. Cook the prawns 1 minute per side. Remove.","Add the remaining oil, shallot and garlic for 20 seconds. Push aside, add the eggs and scramble for 30 seconds.","Add noodles and sauce. Toss 1–2 minutes, adding a splash of water if they stick. Return prawns and tofu, add sprouts and spring onion, toss 30 seconds. Serve with peanuts and lime."],"tip":"Taste the sauce before it goes in: add lime for sour, sugar for sweet, fish sauce for salt. Nutrition is an estimate.","pan":"Preheat on medium, water test, then oil.\nRice noodles grab stainless: use the full tablespoon of oil, keep them moving, and loosen with a splash of water.\nGet the tofu crisp first. It lets go of the pan when the crust has formed.","sources":[{"name":"rasamalaysia.com","url":"https://rasamalaysia.com/wprm_print/shrimp-pad-thai"},{"name":"thedailymeal.com","url":"https://www.thedailymeal.com/1136482/shrimp-pad-thai-recipe/"}],"spicy":1},{"id":"n4","name":"Chicken Katsu Curry","cuisine":"Japanese","time":40,"servings":2,"kcal":520,"protein":44,"main":"poultry","veg":false,"isNew":true,"ingredients":["2 small chicken breasts (about 300 g), each halved horizontally into thin cutlets","2 tbsp plain flour","1 egg, beaten","50 g panko breadcrumbs","3 tbsp neutral oil, for shallow frying","1 tsp neutral oil, for the sauce","1/2 onion, finely diced","1 garlic clove, minced","1 tsp grated ginger","1 tbsp curry powder","1 tbsp plain flour (sauce)","300 ml chicken stock","1 tbsp soy sauce","1 tsp honey","1 tsp rice vinegar","120 g cucumber, sliced","Salt and pepper"],"steps":["Soften the onion in 1 tsp oil for 5 minutes. Add garlic and ginger for 30 seconds, then curry powder and flour for 1 minute.","Whisk in the stock gradually. Add soy and honey and simmer 10 minutes. Blend smooth if you like, stir in the vinegar and keep warm.","Flatten the chicken to an even thickness and season. Coat each piece in flour, then egg, then panko.","Add 3 tbsp oil to the preheated pan over medium. Fry 2 cutlets at a time, 3–4 minutes per side, until golden and 74°C inside. Rest 3 minutes, slice, and serve with the sauce, cucumber and a measured portion of rice."],"tip":"If the panko darkens faster than the chicken cooks, lower the heat. Nutrition is an estimate including frying oil and excluding rice.","pan":"Preheat on medium (not higher), water test, then a thin layer of oil that shimmers.\nBreadcrumbs burn on stainless if the pan is too hot. Fry two cutlets at a time and do not move them until the crust is set and they release.\nWipe out burnt crumbs between batches.","sources":[{"name":"tesco.com","url":"https://www.tesco.com/recipes/en-GB/recipe/chicken-katsu-curry"},{"name":"gourmettraveller.com.au","url":"https://www.gourmettraveller.com.au/recipe/fast-recipes/chicken-katsu-curry-13479/"}],"spicy":0},{"id":"n5","name":"Lentil Skillet with Spinach & Egg","cuisine":"Mediterranean","time":30,"servings":2,"kcal":410,"protein":26,"main":"veg","veg":true,"isNew":true,"ingredients":["1 tsp olive oil","1 small onion, diced","2 garlic cloves, minced","1 tsp smoked paprika","1 tsp ground cumin","1/2 tsp dried thyme","1 can chopped tomatoes (400 g)","1 can cooked lentils, drained (240 g)","100 ml vegetable stock","100 g spinach","4 eggs","30 g feta","Parsley and black pepper"],"steps":["Soften the onion in the oil over medium heat for 5 minutes. Add garlic, paprika, cumin and thyme for 30 seconds.","Add tomatoes, lentils and stock. Simmer 10 minutes until thick, stirring so the edges do not catch.","Fold in the spinach until wilted. Make 4 wells and crack an egg into each.","Cover and cook gently 4–5 minutes until the whites are set. Top with feta, parsley and pepper."],"tip":"Keep the heat low once the eggs go in. Use a pan with a lid. Nutrition is an estimate for 2 eggs per serving and excludes bread.","pan":"Preheat on medium, then oil and onion. Acidic tomatoes are fine in stainless.\nStir the thick sauce often to stop the edges catching; a splash of stock loosens it.\nEggs cook on top of the sauce, so there is nothing to stick.","sources":[{"name":"dailyherald.com","url":"https://www.dailyherald.com/20260204/food/eggs-can-do-so-much-more-than-breakfast-as-these-skillet-lentils-show/"},{"name":"centr.com","url":"https://centr.com/recipe/show/32833/indian-inspired-lentil-shakshuka-"}],"spicy":0},{"id":"n6","name":"Tomato & Egg Stir-Fry","cuisine":"Chinese","time":20,"servings":2,"kcal":230,"protein":13,"main":"veg","veg":true,"spicy":0,"isNew":true,"ingredients":["4 eggs","3 medium ripe tomatoes (about 450 g)","1 tsp sugar","1/2 tsp salt (for the tomatoes)","1 pinch salt (for the eggs)","1 tsp light soy sauce","1 tsp Shaoxing wine or dry sherry","1 tsp cornflour + 2 tbsp water","1 tbsp neutral oil, for the eggs","2 tsp neutral oil, for the tomatoes","2 spring onions, sliced","Chilli oil (optional, for heat)"],"steps":["Score a small X on the base of each tomato, blanch 30 seconds in boiling water, then peel. Cut into chunks, toss with the 1/2 tsp salt and drain in a colander for 10–15 minutes.","Beat the eggs with a pinch of salt and 1 tsp water. Mix the sugar, soy sauce, wine and cornflour slurry in a small bowl.","Add 1 tbsp oil to the preheated pan and swirl. Pour in the eggs, leave 10 seconds, then pull the edges to the centre in big curds. Take them out while still about 80% set and slightly wet.","Add 2 tsp oil. Cook the drained tomatoes 2–3 minutes until they soften and release juice. Stir in the sauce and simmer 1–2 minutes until glossy.","Fold the eggs back in for 30 seconds. Finish with spring onion and a spoon of chilli oil if you like. Serve with a measured portion of rice."],"tip":"Salting and draining the tomatoes keeps the dish from going watery. For more protein, add 150 g peeled prawns or 150 g minced pork browned before the tomatoes. Nutrition is an estimate and excludes rice.","pan":"Eggs stick to stainless unless the pan is properly hot: preheat on medium-high 2–3 minutes and do the water test.\nUse the full tablespoon of oil, swirl it up the sides, and wait until it shimmers before the eggs go in.\nLet the bottom set before you pull. If the curds grab, wait another 10 seconds. Tomatoes are acidic but safe in stainless.","sources":[{"name":"spice.alibaba.com","url":"https://spice.alibaba.com/spice-basics/tomato-egg-stir-fry-recipe"}]},{"id":"n7","name":"Kung Pao Chicken","cuisine":"Sichuan","time":30,"servings":2,"kcal":420,"protein":38,"main":"poultry","veg":false,"spicy":2,"isNew":true,"ingredients":["350 g chicken thigh, cut into 1.5 cm cubes","1 tbsp soy sauce (marinade)","1 tbsp Shaoxing wine (marinade)","2 tsp cornflour","1 tbsp soy sauce (sauce)","2 tsp Chinkiang black vinegar","1 tbsp honey","2 tbsp chicken stock","1 tsp sesame oil","1 tsp cornflour (sauce)","1/2 tsp ground Sichuan pepper","2 tbsp neutral oil","6 dried red chillies, snipped, seeds shaken out","3 spring onions, sliced","2 garlic cloves, sliced","2 thin slices ginger","2 celery sticks, diced","1 small red pepper, diced","40 g roasted peanuts"],"steps":["Toss the chicken with the marinade soy, wine and 2 tsp cornflour; leave 10 minutes. Stir the sauce ingredients (soy, vinegar, honey, stock, sesame oil, 1 tsp cornflour, Sichuan pepper) together.","Add 1 tbsp oil to the preheated pan. Cook the chicken in two batches, one layer, 1 minute undisturbed then 2–3 minutes tossing, until cooked through. Remove.","Lower to medium. Add the last 1 tbsp oil and the chillies for 10–15 seconds, until they darken but do not blacken. Add garlic, ginger and spring onion for 20 seconds.","Add celery and pepper for 1 minute. Return the chicken, stir the sauce again, pour it in and cook about 1 minute until glossy. Toss in the peanuts and serve straight away."],"tip":"Chillies burn in seconds. Pull the pan off the heat if they smoke. Nutrition is an estimate and excludes rice.","pan":"Preheat on medium-high, water test, then oil.\nCornflour-coated chicken grabs if you move it too soon: leave it a full minute until it releases.\nLower the heat before the chillies and garlic go in. Honey in the sauce scorches on stainless, so keep the final step short.","sources":[{"name":"beyondkimchee.com","url":"https://www.beyondkimchee.com/wprm_print/authentic-kung-pao-chicken-sichuan-stir-fry"},{"name":"chinesecookingdemystified","url":"https://chinesecookingdemystified.substack.com/p/kung-pao-chicken-the-first-recipe"}]},{"id":"n8","name":"Fish-Fragrant Pork Shreds","cuisine":"Sichuan","time":30,"servings":2,"kcal":330,"protein":35,"main":"red","veg":false,"spicy":2,"isNew":true,"ingredients":["300 g pork tenderloin, cut into thin strips","2 tsp light soy sauce (marinade)","2 tsp Shaoxing wine","1 tsp cornflour","1 tbsp doubanjiang or 2 tbsp chilli garlic sauce","2 tbsp Chinkiang black vinegar","1 tbsp light soy sauce (sauce)","1 tbsp sugar","2 tsp cornflour (sauce)","3 tbsp water","1 1/2 tbsp neutral oil","2 tsp minced ginger","2 garlic cloves, minced","1 carrot, cut into matchsticks","1 red pepper, thinly sliced","100 g bamboo shoot strips or 2 celery sticks","2 spring onions, sliced"],"steps":["Marinate the pork with the soy, wine and 1 tsp cornflour for 10 minutes. Stir the doubanjiang, vinegar, soy, sugar, 2 tsp cornflour and water together.","Add 1 tbsp oil to the preheated pan. Spread the pork in one layer, leave 20–30 seconds, then stir until it just turns pale, about 1 minute. Remove.","Lower to medium. Add the remaining oil, ginger and garlic for 15 seconds. Add the carrot for 1 minute, then bamboo shoot or celery for 1 minute, then the pepper.","Return the pork. Stir the sauce again, pour it in and toss for 30–45 seconds until glossy. Add spring onion and serve at once."],"tip":"Sweet, sour and spicy should all be present. Add more vinegar for sour, sugar for sweet, doubanjiang for heat. Nutrition is an estimate and excludes rice.","pan":"Preheat on medium-high, water test, then oil.\nThe pork strips are small and starchy: spread them out and give them 20–30 seconds before stirring so they release.\nSugar and bean paste scorch, so lower the heat once the pork comes out.","sources":[{"name":"omnivorescookbook.com","url":"https://omnivorescookbook.com/yu-xiang-rou-si/"},{"name":"woksoflove.com","url":"https://woksoflove.com/wprm_print/fish-fragrant-pork-yu-xiang-rou-si"}]},{"id":"n9","name":"Sichuan Boiled Beef","cuisine":"Sichuan","time":35,"servings":2,"kcal":480,"protein":30,"main":"red","veg":false,"spicy":3,"isNew":true,"ingredients":["250 g flank or sirloin steak, sliced 3 mm thick across the grain","1/8 tsp bicarbonate of soda","2 tbsp water","2 tsp cornflour","150 g soybean or bean sprouts","100 g enoki mushrooms or pak choi leaves","1 tbsp neutral oil, for the vegetables","1 tbsp neutral oil, for the chilli base","3 slices ginger","2 spring onions, white parts, cut in short pieces","2 tsp Sichuan peppercorns","2 tbsp doubanjiang (spicy bean paste)","300 ml chicken stock","1 tsp sugar","2 garlic cloves, minced","1 tsp chilli flakes","1 tbsp chopped coriander","1/2 tsp ground Sichuan pepper","1 tbsp neutral oil, for the hot-oil finish"],"steps":["Toss the beef with the bicarbonate and water, leave 10 minutes, rinse briefly under cold water, drain, pat dry and toss with the cornflour.","Add 1 tbsp oil to the preheated pan. Stir-fry the sprouts 2 minutes, add the enoki until just wilted, and spread them across the bottom of a deep bowl. Wipe out the pan.","Over medium-low heat, warm 1 tbsp oil. Fry ginger until lightly golden, add spring onion and peppercorns for 1 minute, then the doubanjiang for 2–3 minutes until the oil turns red.","Add the stock and sugar and bring to the boil. Slide in the beef, separate the slices gently and switch off the heat as soon as it turns opaque, about 1 minute. Pour over the vegetables.","Top with garlic, chilli flakes, coriander and ground Sichuan pepper. Heat the last 1 tbsp oil in the pan until it shimmers and pour it over. Serve with rice."],"tip":"Do not overcook the beef: it keeps cooking in the broth. Eat with a measured portion of rice. Nutrition is an estimate and excludes rice.","pan":"Preheat on medium, then oil for the vegetables.\nDoubanjiang scorches on stainless. Keep the heat at medium-low and stir constantly until the oil is red, then add stock straight away.\nThe hot-oil finish needs only a minute in the empty pan, watching for shimmer and no more.","sources":[{"name":"woksoflife.com","url":"https://thewoksoflife.com/wprm_print/sichuan-boiled-beef-shuizhu-niurou"},{"name":"chinasichuanfood.com","url":"https://www.chinasichuanfood.com/shui-zhu-beef/"}]},{"id":"n10","name":"Twice-Cooked Pork","cuisine":"Sichuan","time":45,"servings":2,"kcal":560,"protein":24,"main":"red","veg":false,"spicy":2,"isNew":true,"ingredients":["250 g pork belly, in one piece","2 tsp doubanjiang","1 tbsp sweet bean sauce (tianmianjiang) or hoisin","1 tbsp Shaoxing wine","1 tsp soy sauce","1 tsp sugar","1 leek, sliced diagonally","1 green pointed pepper, sliced","1 tsp minced ginger","1 tsp neutral oil"],"steps":["Cover the pork with cold water, bring to the boil, then simmer gently for 20 minutes. Lift out and cool in cold water for 10 minutes (or chill for a few hours for neater slices).","Slice the pork 3–4 mm thick. Stir the sweet bean sauce, wine, soy and sugar together.","Add the oil to the preheated pan. Fry the pork in two batches for 3–4 minutes, turning once, until the edges curl and crisp. Push aside and pour off all but 1 tbsp fat.","Fry the doubanjiang and ginger 15 seconds until the oil turns red. Add leek and pepper for 2 minutes, then the sauce. Toss 1 minute until glossy and serve with a measured portion of rice."],"tip":"Belly is rich: serve with plain greens. A leaner version works with pork loin, though it loses the crisp edges. Nutrition is an estimate and excludes rice.","pan":"Preheat on medium, water test, then a small amount of oil.\nPork belly renders its own fat, so it releases from stainless once the edges brown. Wait for the curl before turning.\nDoubanjiang and sweet bean sauce scorch: lower the heat before they go in.","sources":[{"name":"norecipes.com","url":"https://norecipes.com/twice-cooked-pork-recipe"},{"name":"saveur.com","url":"https://www.saveur.com/twice-cooked-pork-belly-recipe"}]},{"id":"n11","name":"Mala Chicken (La Zi Ji)","cuisine":"Sichuan","time":30,"servings":2,"kcal":450,"protein":33,"main":"poultry","veg":false,"spicy":3,"isNew":true,"ingredients":["350 g chicken thigh, cut into 2 cm cubes","1 tbsp Shaoxing wine","1 tbsp light soy sauce","3 tbsp cornflour","1/2 tsp cayenne or chilli powder","1 tsp ground Sichuan pepper","1/2 tsp salt","3 tbsp neutral oil","15 g dried Sichuan chillies (a large handful)","1 tbsp Sichuan chilli flakes","1 tsp sugar","1 tsp toasted sesame seeds","1 tsp whole Sichuan peppercorns","3 garlic cloves, sliced","2 tsp minced ginger","3 spring onions, sliced","1 handful coriander"],"steps":["Toss the chicken with the wine and soy, leave 10 minutes, then drain off the liquid. Shake the cornflour, cayenne, ground Sichuan pepper and salt in a bag, add the chicken and coat evenly.","Mix the dried chillies, chilli flakes, sugar and sesame seeds in a bowl.","Add 2 tbsp oil to the preheated pan. Fry the chicken in two batches, one layer, 2–3 minutes per side until golden and cooked through. Remove.","Lower to medium-low. Add the last 1 tbsp oil and the whole peppercorns for 20 seconds. Add garlic, ginger and spring onion for 20 seconds, then the chilli mix for 10–15 seconds, stirring, until the chillies just darken.","Return the chicken and toss well. Add coriander, switch off the heat and serve with rice. Most of the whole chillies are for flavour, not eating."],"tip":"This is very hot. Use half the dried chillies for a gentler version. Open a window: the chilli fumes are strong. Nutrition is an estimate including frying oil and excludes rice.","pan":"Preheat on medium-high, water test, then oil.\nThe coating sticks if disturbed: leave each side 2 minutes until it releases on its own. Cook in two batches.\nDried chillies and peppercorns burn in seconds on a hot stainless pan. Drop to medium-low before they go in and pull off the heat if they smoke.","sources":[{"name":"omnivorescookbook.com","url":"https://omnivorescookbook.com/mala-chicken/"},{"name":"3thanwong.com","url":"https://3thanwong.com/en/la-zi-ji-mala-chicken/"}]},{"id":"n12","name":"Sichuan Chilli-Garlic Prawns","cuisine":"Sichuan","time":20,"servings":2,"kcal":290,"protein":30,"main":"fish","veg":false,"spicy":2,"isNew":true,"ingredients":["300 g peeled raw prawns","1 tsp Shaoxing wine","1/4 tsp salt","2 tsp cornflour","2 tsp plain flour","3 tbsp chilli garlic sauce","1 tbsp brown sugar","1 tsp soy sauce","3 tbsp neutral oil, for frying","1 tsp neutral oil, for the sauce","1 tbsp minced ginger","2 garlic cloves, minced","Spring onion, sliced"],"steps":["Pat the prawns dry and toss with the wine and salt. Stir the chilli garlic sauce, sugar and soy sauce together until the sugar dissolves.","Just before cooking, toss the prawns with the cornflour and flour. Shake off the excess.","Add 3 tbsp oil to the preheated pan. Fry the prawns in two batches, one layer, 2 minutes per side without moving, until golden and crisp. Remove.","Switch off the heat and wipe out the pan. Return to medium-low with 1 tsp oil. Fry ginger and garlic for 30 seconds, add the sauce and stir 20–30 seconds until thick and glossy.","Off the heat, return the prawns and toss. Top with spring onion and serve with steamed greens or a measured portion of rice."],"tip":"Prawns turn rubbery fast: 2 minutes a side is plenty. Nutrition is an estimate including frying oil and excludes rice.","pan":"Preheat on medium-high, water test, then a good layer of oil.\nThe flour coating releases from stainless once it has crisped. If a prawn grabs, wait another 20 seconds.\nWipe out the burnt bits before the sugary sauce goes in, then keep the heat at medium-low.","sources":[{"name":"omnivorescookbook.com","url":"https://omnivorescookbook.com/sichuan-spicy-shrimp-stir-fry/"},{"name":"camilamade.com","url":"https://camilamade.com/chinese-chili-garlic-shrimp/"}]}];

/* ---------- recipes ---------- */
function norm(r){return Object.assign({servings:2,time:30,main:'other',veg:false,spicy:0,tip:'',ingredients:[],steps:[],sources:[],cuisine:''},r)}
function allRecipes(){
  var out=[];

function byId(id){return allRecipes().filter(function(r){return r.id===id})[0]}
